name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (7-char git SHA from CI, or latest)"
        required: true
        default: "latest"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment: aks-store
    steps:
      - uses: actions/checkout@v5

      - name: Set image tag
        run: |
          echo "IMAGE_PREFIX=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)" >> "$GITHUB_ENV"
          fi

      - name: Prepare manifests
        run: |
          K8S_DIR="${RUNNER_TEMP}/kubernetes"
          cp -r kubernetes "$K8S_DIR"
          for svc in store-front store-admin order-service product-service makeline-service ai-service; do
            sed -i "s|image: ${svc}:latest|image: ${IMAGE_PREFIX}/${svc}:${IMAGE_TAG}|g" \
              "$K8S_DIR/${svc}/deployment.yaml"
          done
          echo "K8S_DIR=$K8S_DIR" >> "$GITHUB_ENV"

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: azure/aks-set-context@v4
        with:
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          use-kubelogin: true

      - name: Deploy to cluster
        run: kubectl apply -f "${K8S_DIR}" --recursive

      - name: Wait for rollouts
        run: |
          for svc in store-front store-admin order-service product-service makeline-service ai-service; do
            kubectl rollout status deployment/"$svc" -n aks-store --timeout=300s
          done
