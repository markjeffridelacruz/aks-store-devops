name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AKS_STORE_DEMO_REPO: https://github.com/Azure-Samples/aks-store-demo.git
  AKS_STORE_DEMO_BRANCH: main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - store-front
          - store-admin
          - order-service
          - product-service
          - makeline-service
          - ai-service
    steps:
      - uses: actions/checkout@v5

      - name: Clone application source
        run: git clone --depth 1 --branch "${{ env.AKS_STORE_DEMO_BRANCH }}" "${{ env.AKS_STORE_DEMO_REPO }}" aks-store-demo

      - name: Set image tags
        run: |
          echo "IMAGE_PREFIX=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: aks-store-demo/src/${{ matrix.service }}
          file: app/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
