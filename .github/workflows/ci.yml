name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/**"
      - "kubernetes/**"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/**"
      - "kubernetes/**"
  workflow_dispatch:

env:
  AKS_STORE_DEMO_REPO: https://github.com/Azure-Samples/aks-store-demo.git
  AKS_STORE_DEMO_BRANCH: main

permissions:
  contents: read
  packages: write

jobs:
  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone aks-store-demo
        run: git clone --depth 1 --branch "${{ env.AKS_STORE_DEMO_BRANCH }}" "${{ env.AKS_STORE_DEMO_REPO }}" aks-store-demo

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test store-front and store-admin
        run: |
          set -e
          for app in store-front store-admin; do
            echo "=== Testing $app ==="
            cd aks-store-demo/src/$app
            npm ci
            npm run type-check
            npm run test:unit -- --run
          done

  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone aks-store-demo
        run: git clone --depth 1 --branch "${{ env.AKS_STORE_DEMO_BRANCH }}" "${{ env.AKS_STORE_DEMO_REPO }}" aks-store-demo

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test order-service
        run: |
          set -e
          cd aks-store-demo/src/order-service
          npm ci
          npm test

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Test makeline-service
        run: |
          set -e
          cd aks-store-demo/src/makeline-service
          go test ./...

      - name: Install Rust and test product-service
        run: |
          set -e
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup default 1.82
          cd aks-store-demo/src/product-service
          cargo test --release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate ai-service
        run: |
          set -e
          cd aks-store-demo/src/ai-service
          pip install -r requirements.txt
          python -m compileall .

  build-and-push:
    name: Build and push (${{ matrix.service }})
    needs: [test-frontend, test-backend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - store-front
          - store-admin
          - order-service
          - product-service
          - makeline-service
          - ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Clone aks-store-demo
        run: git clone --depth 1 --branch "${{ env.AKS_STORE_DEMO_BRANCH }}" "${{ env.AKS_STORE_DEMO_REPO }}" aks-store-demo

      - name: Set image registry
        run: |
          echo "REGISTRY=ghcr.io" >> "$GITHUB_ENV"
          echo "IMAGE_PREFIX=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: aks-store-demo/src/${{ matrix.service }}
          file: app/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
