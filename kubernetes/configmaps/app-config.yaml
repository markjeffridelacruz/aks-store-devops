apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: aks-store
data:
  # MongoDB (aligned with docker-compose makeline-service)
  ORDER_DB_URI: mongodb://mongodb:27017
  ORDER_DB_NAME: orderdb
  ORDER_DB_COLLECTION_NAME: orders

  # RabbitMQ (aligned with docker-compose order-service / makeline-service)
  ORDER_QUEUE_HOSTNAME: rabbitmq
  ORDER_QUEUE_PORT: "5672"
  ORDER_QUEUE_URI: amqp://rabbitmq:5672
  ORDER_QUEUE_NAME: orders
  ORDER_QUEUE_RECONNECT_LIMIT: "3"

  # Service URLs (Kubernetes DNS names)
  ORDER_SERVICE_URL: http://order-service:3000/
  PRODUCT_SERVICE_URL: http://product-service:3002/
  MAKELINE_SERVICE_URL: http://makeline-service:3001
  AI_SERVICE_URL: http://ai-service:5001/

  # ai-service (aligned with docker-compose; set secrets for API keys)
  USE_AZURE_OPENAI: "True"
