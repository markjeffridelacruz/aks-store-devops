apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: aks-store
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.37
          command:
            - sh
            - -c
            - until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done
      containers:
        - name: order-service
          image: ghcr.io/markjeffridelacruz/aks-store-devops/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: ORDER_QUEUE_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ORDER_QUEUE_HOSTNAME
            - name: ORDER_QUEUE_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ORDER_QUEUE_PORT
            - name: ORDER_QUEUE_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ORDER_QUEUE_NAME
            - name: ORDER_QUEUE_RECONNECT_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ORDER_QUEUE_RECONNECT_LIMIT
            - name: ORDER_QUEUE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ORDER_QUEUE_USERNAME
            - name: ORDER_QUEUE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ORDER_QUEUE_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
