apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aks-store-ingress
  namespace: aks-store
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    # Customer store (docker-compose port 8080)
    - host: store.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: store-front
                port:
                  number: 80
    # Admin UI (docker-compose port 8081)
    - host: admin.store.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: store-admin
                port:
                  number: 80
