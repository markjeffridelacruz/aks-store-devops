apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: aks-store
type: Opaque
stringData:
  # RabbitMQ (aligned with docker-compose: username / password)
  RABBITMQ_DEFAULT_USER: username
  RABBITMQ_DEFAULT_PASS: password
  ORDER_QUEUE_USERNAME: username
  ORDER_QUEUE_PASSWORD: password
