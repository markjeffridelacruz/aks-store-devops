apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: aks-store
type: Opaque
stringData:
  # RabbitMQ (aligned with docker-compose: username / password)
  RABBITMQ_DEFAULT_USER: username
  RABBITMQ_DEFAULT_PASS: password
  ORDER_QUEUE_USERNAME: username
  ORDER_QUEUE_PASSWORD: password

  # ai-service — replace before deploying (aligned with docker-compose)
  AZURE_OPENAI_DEPLOYMENT_NAME: ""
  AZURE_OPENAI_ENDPOINT: ""
  OPENAI_API_KEY: ""
  OPENAI_ORG_ID: ""
